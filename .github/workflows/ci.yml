name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core
          pip install -e packages/cli
          pip install pytest
      - name: Run tests
        run: pytest packages/core packages/cli

  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build distributions
        run: |
          python -m build packages/core
          python -m build packages/cli

  package:
    name: package integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version single-source is consistent
        run: |
          python scripts/sync-version.py
          git diff --exit-code -- '**/pyproject.toml' '*-plugin/*.json' '.claude-plugin/*.json' gemini-extension.json
      - name: Skill mirror is in sync (no drift)
        run: |
          python scripts/sync-plugin-skills.py
          git diff --exit-code -- skills/
      - name: Plugin package integrity check
        run: python scripts/check-plugin-package.py

  install-smoke:
    name: install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install into a fresh venv (Unix)
        if: runner.os != 'Windows'
        run: |
          python -m venv /tmp/sm-venv
          /tmp/sm-venv/bin/pip install --upgrade pip
          /tmp/sm-venv/bin/pip install ./packages/core ./packages/cli
          /tmp/sm-venv/bin/sybermem --help || true
          /tmp/sm-venv/bin/sybermem resume --format json || true
      - name: Install into a fresh venv (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv $env:TEMP\sm-venv
          & "$env:TEMP\sm-venv\Scripts\pip.exe" install --upgrade pip
          & "$env:TEMP\sm-venv\Scripts\pip.exe" install ./packages/core ./packages/cli
          & "$env:TEMP\sm-venv\Scripts\sybermem.exe" --help
