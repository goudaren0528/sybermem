[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sybermem-core"
version = "0.1.1"
description = "Core identity, registry, indexing, and search logic for SyberMem"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "goudaren0528" }]
keywords = ["sybermem", "memory", "ai-agent", "claude-code", "opencode"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/goudaren0528/sybermem"
Repository = "https://github.com/goudaren0528/sybermem"
Issues = "https://github.com/goudaren0528/sybermem/issues"
Changelog = "https://github.com/goudaren0528/sybermem/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["sybermem_core*"]
